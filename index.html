<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Walter Heitor — Desenvolvedor Back-end Sênior. Kotlin, Java, Python, Spring Boot, AWS, Kafka." />
    <meta name="theme-color" content="#7c3aed" />
    <title>Walter Heitor — Back-end Developer Sênior</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('wh-portfolio-theme');
          var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
          var theme = stored === 'light' || stored === 'dark' ? stored : prefersLight ? 'light' : 'dark';
          if (theme === 'dark') document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
